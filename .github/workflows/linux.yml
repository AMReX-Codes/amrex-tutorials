name: linux

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-linux
  cancel-in-progress: true

env:
  CXXFLAGS_STRICT: "-Werror -Wall -Wextra -Wshadow -Woverloaded-virtual -Wextra-semi -Wunreachable-code -fno-operator-names"
  # GCC -Wmaybe-uninitialized gives false positives at -O3, including from AMReX headers.
  # Clang does not know this option and rejects it under -Werror.
  CXXFLAGS_GCC: "-Wno-maybe-uninitialized"
  OMP_NUM_THREADS: 2

jobs:

  gcc_debug:
    name: GCC Debug MPI OpenMP 3D
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies.sh
    - name: Build
      run: |
        cmake -S . -B build                 \
            -DAMReX_TESTING=ON              \
            -DCMAKE_BUILD_TYPE=Debug        \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS_STRICT} ${CXXFLAGS_GCC}" \
            -DAMReX_OMP=ON                  \
            -DAMReX_TINY_PROFILE=ON         \
            -DAMReX_FORTRAN_INTERFACES=ON   \
            -DMPIEXEC_PREFLAGS=--oversubscribe
        cmake --build build -j 4
    - name: Test
      run: ctest --test-dir build --output-on-failure

  gcc_2d:
    name: GCC 2D
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies.sh
    - name: Build
      run: |
        cmake -S . -B build                 \
            -DAMReX_TESTING=ON                     \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS_STRICT} ${CXXFLAGS_GCC}" \
            -DAMReX_SPACEDIM=2              \
            -DAMReX_FORTRAN_INTERFACES=ON   \
            -DMPIEXEC_PREFLAGS=--oversubscribe
        cmake --build build -j 4
    - name: Test
      run: ctest --test-dir build --output-on-failure

  gcc_1d:
    name: GCC 1D
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies.sh
    - name: Build
      run: |
        cmake -S . -B build                 \
            -DAMReX_TESTING=ON                     \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS_STRICT} ${CXXFLAGS_GCC}" \
            -DAMReX_SPACEDIM=1              \
            -DAMReX_EB=OFF                  \
            -DAMReX_FFT=OFF                 \
            -DMPIEXEC_PREFLAGS=--oversubscribe
        cmake --build build -j 4
    - name: Test
      run: ctest --test-dir build --output-on-failure

  clang_single:
    name: Clang single precision, no MPI
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies_clang.sh 18
    - name: Build
      run: |
        cmake -S . -B build                 \
            -DCMAKE_C_COMPILER=$(which clang)       \
            -DCMAKE_CXX_COMPILER=$(which clang++)   \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS_STRICT}"  \
            -DAMReX_MPI=OFF                 \
            -DAMReX_PRECISION=SINGLE        \
            -DAMReX_PARTICLES_PRECISION=SINGLE
        cmake --build build -j 4
    - name: Test
      run: ctest --test-dir build --output-on-failure

  cuda:
    name: CUDA (compile only)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies_nvcc.sh 12.6
    - name: Build
      run: |
        export PATH=/usr/local/cuda/bin:${PATH}
        cmake -S . -B build                         \
            -DCMAKE_CXX_FLAGS="-fno-operator-names" \
            -DAMReX_GPU_BACKEND=CUDA                \
            -DCMAKE_CUDA_ARCHITECTURES=80           \
            -DAMReX_TINY_PROFILE=ON                 \
            -DAMReX_CUDA_ERROR_CROSS_EXECUTION_SPACE_CALL=ON \
            -DAMReX_CUDA_ERROR_CAPTURE_THIS=ON
        cmake --build build -j 4

  hip:
    name: HIP (compile only)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies_hip.sh
    - name: Build
      run: |
        source /etc/profile.d/rocm.sh
        # "mpic++ --showme" forgets open-pal in Ubuntu 24.04 + OpenMPI
        export LDFLAGS="-lopen-pal"
        cmake -S . -B build                         \
            -DCMAKE_C_COMPILER=$(which clang)       \
            -DCMAKE_CXX_COMPILER=$(which clang++)   \
            -DCMAKE_CXX_FLAGS="-fno-operator-names -Wno-deprecated-declarations" \
            -DAMReX_GPU_BACKEND=HIP                 \
            -DAMReX_AMD_ARCH=gfx90a
        cmake --build build -j 4

  sycl:
    name: SYCL (compile only)
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies_dpcpp.sh
    - name: Build
      run: |
        set +e
        source /opt/intel/oneapi/setvars.sh
        set -e
        cmake -S . -B build                         \
            -DCMAKE_C_COMPILER=$(which icx)         \
            -DCMAKE_CXX_COMPILER=$(which icpx)      \
            -DCMAKE_CXX_FLAGS="-fno-operator-names" \
            -DAMReX_GPU_BACKEND=SYCL                \
            -DAMReX_FFT=OFF
        cmake --build build -j 4

  gnumake:
    name: GNU Make
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies.sh
    - name: Get AMReX
      run: git clone --depth 1 https://github.com/AMReX-Codes/amrex.git ../amrex
    - name: Build and run
      run: .github/workflows/scripts/gnumake.sh

  build_systems:
    name: Standalone projects
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies.sh
    - name: Superbuild
      run: |
        cp -r BuildSystems/CMakeSuperbuild ${RUNNER_TEMP}/superbuild
        cmake -S ${RUNNER_TEMP}/superbuild -B ${RUNNER_TEMP}/superbuild/build
        cmake --build ${RUNNER_TEMP}/superbuild/build -j 4
        mpiexec -n 2 ${RUNNER_TEMP}/superbuild/build/MyApp
    - name: Installed AMReX
      run: |
        git clone --depth 1 https://github.com/AMReX-Codes/amrex.git ${RUNNER_TEMP}/amrex
        cmake -S ${RUNNER_TEMP}/amrex -B ${RUNNER_TEMP}/amrex/build \
            -DAMReX_TESTING=ON                                      \
            -DAMReX_SPACEDIM="2;3" -DAMReX_EB=ON -DAMReX_FFT=ON     \
            -DCMAKE_INSTALL_PREFIX=${RUNNER_TEMP}/amrex-install
        cmake --build ${RUNNER_TEMP}/amrex/build -j 4 --target install
        cmake -S BuildSystems/CMakeInstalledAMReX -B build-installed \
            -DAMReX_ROOT=${RUNNER_TEMP}/amrex-install
        cmake --build build-installed -j 4
        mpiexec -n 2 build-installed/MyApp
    - name: Tutorials with installed AMReX (2D)
      run: |
        cmake -S . -B build-tutorials                 \
            -DAMReX_TESTING=ON                        \
            -DAMReX_ROOT=${RUNNER_TEMP}/amrex-install \
            -DAMReXTutorials_DIM=2                    \
            -DAMReXTutorials_TOPICS="Base;FFT;EB"     \
            -DMPIEXEC_PREFLAGS=--oversubscribe
        cmake --build build-tutorials -j 4
        ctest --test-dir build-tutorials --output-on-failure
    - name: Standalone applications
      run: |
        for app in CNS IncFlow; do
          cp -r Applications/${app} ${RUNNER_TEMP}/${app}
          cmake -S ${RUNNER_TEMP}/${app} -B ${RUNNER_TEMP}/${app}/build \
              -DFETCHCONTENT_SOURCE_DIR_AMREX=${RUNNER_TEMP}/amrex
          cmake --build ${RUNNER_TEMP}/${app}/build -j 4
        done

  sundials:
    name: SUNDIALS
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: .github/workflows/dependencies/dependencies.sh
    - name: Build
      run: |
        cmake -S . -B build                 \
            -DAMReX_TESTING=ON                     \
            -DCMAKE_CXX_FLAGS="${CXXFLAGS_STRICT} ${CXXFLAGS_GCC}" \
            -DAMReX_SUNDIALS=ON             \
            -DAMReX_EB=OFF                  \
            -DAMReX_FFT=OFF                 \
            -DAMReXTutorials_TOPICS=TimeIntegration \
            -DMPIEXEC_PREFLAGS=--oversubscribe
        cmake --build build -j 4
    - name: Test
      run: ctest --test-dir build --output-on-failure

  python:
    name: pyAMReX
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies.sh
        python3 -m venv --system-site-packages ${RUNNER_TEMP}/venv
        ${RUNNER_TEMP}/venv/bin/python -m pip install --upgrade pip numpy mpi4py
    - name: Build pyAMReX
      run: |
        git clone --depth 1 https://github.com/AMReX-Codes/amrex.git ${RUNNER_TEMP}/amrex
        git clone --depth 1 https://github.com/AMReX-Codes/pyamrex.git ${RUNNER_TEMP}/pyamrex
        cmake -S ${RUNNER_TEMP}/pyamrex -B ${RUNNER_TEMP}/pyamrex-build \
            -DpyAMReX_amrex_src=${RUNNER_TEMP}/amrex                    \
            -DAMReX_SPACEDIM="2;3"                                      \
            -DpyAMReX_BUILD_TESTING=OFF                                 \
            -DPython_EXECUTABLE=${RUNNER_TEMP}/venv/bin/python
        cmake --build ${RUNNER_TEMP}/pyamrex-build -j 4 --target pip_install
    - name: Build
      run: |
        cmake -S . -B build                                       \
            -DAMReX_TESTING=ON                                    \
            -DFETCHCONTENT_SOURCE_DIR_AMREX=${RUNNER_TEMP}/amrex  \
            -DAMReXTutorials_PYTHON=ON                            \
            -DAMReXTutorials_TOPICS="Python;Coupling"             \
            -DPython3_EXECUTABLE=${RUNNER_TEMP}/venv/bin/python   \
            -DAMReX_EB=OFF                                        \
            -DAMReX_FFT=OFF                                       \
            -DMPIEXEC_PREFLAGS=--oversubscribe
        cmake --build build -j 4
    - name: Test
      run: ctest --test-dir build --output-on-failure

  torch:
    name: PyTorch
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Dependencies
      run: |
        .github/workflows/dependencies/dependencies.sh
        python3 -m pip install --break-system-packages torch --index-url https://download.pytorch.org/whl/cpu
    - name: Build
      run: |
        cmake -S . -B build                 \
            -DAMReX_TESTING=ON              \
            -DAMReXTutorials_TORCH=ON       \
            -DAMReXTutorials_TOPICS=ML      \
            -DAMReX_EB=OFF                  \
            -DAMReX_FFT=OFF                 \
            -DCMAKE_PREFIX_PATH=$(python3 -c "import torch; print(torch.utils.cmake_prefix_path)") \
            -DMPIEXEC_PREFLAGS=--oversubscribe
        cmake --build build -j 4
    - name: Test
      run: ctest --test-dir build --output-on-failure
